server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gestionarea rutelor pentru aplicațiile React (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching agresiv pentru imagini și fișiere statice (valabil 30 de zile)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Caching pentru documente mari sau fișiere de tip PDF/arhive
    location ~* \.(pdf|zip|docx|xlsx)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
