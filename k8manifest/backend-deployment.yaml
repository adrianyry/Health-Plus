apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # --- INIT CONTAINERS: Forțează backend-ul să aștepte pornirea Vault ---
      #initContainers:
      #  - name: wait-for-vault
      #    image: alpine:latest
      #    command:
      #      - 'sh'
      #      - '-c'
      #      - |
      #        echo "Așteptăm ca Vault să pornească..."
      #        until wget -qO- http://vault-service-cluster.local:8200/v1/sys/health > /dev/null 2>&1; do
      #          echo "Vault nu este gata, reîncercăm în 2 secunde..."
      #          sleep 2
      #       done
      #        echo "Vault a pornit cu succes!"
      containers:
      - name: backend
        image: adrianirimus/health-plus-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
          - name: DB_HOST
            value: "postgres-service"
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: DB_NAME
            value: "health_plus_db"
          - name: VAULT_ADDR
            value: "http://vault-service-cluster.local:8200"
          - name: VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: vault-token-secret
                key: VAULT_TOKEN
          - name: AWS_ENDPOINT_URL
            value: "http://host.docker.internal:4566"
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"
          - name: AWS_REGION
            value: "eu-central-1"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
