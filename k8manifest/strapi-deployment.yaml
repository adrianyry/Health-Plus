apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi-deployment
  namespace: default
  labels:
    app: strapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strapi
  template:
    metadata:
      labels:
        app: strapi
    spec:
      containers:
      - name: strapi
        image: health-plus-strapi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1337
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "1337"
        - name: BROWSER
          value: "none"
        - name: DATABASE_CLIENT
          value: "postgres"
        - name: DATABASE_HOST
          value: "postgres-service"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "health_plus_db"
        - name: DATABASE_USERNAME
          value: "health_user"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_SSL
          value: "false"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: strapi-secrets
              key: JWT_SECRET
        - name: ADMIN_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: strapi-secrets
              key: ADMIN_JWT_SECRET
        - name: APP_KEYS
          valueFrom:
            secretKeyRef:
              name: strapi-secrets
              key: APP_KEYS
---
apiVersion: v1
kind: Service
metadata:
  name: strapi-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: strapi
  ports:
  - port: 1337
    targetPort: 1337
