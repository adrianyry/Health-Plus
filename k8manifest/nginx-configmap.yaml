apiVersion: v1
kind: ConfigMap
metadata:
  name: health-plus-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Gestionarea rutelor pentru React SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Caching pentru imagini (30 zile)
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Caching pentru documente mari (7 zile)
        location ~* \.(pdf|zip|docx|xlsx)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }
    }
