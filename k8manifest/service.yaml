kind: Service
metadata:
  name: ecommerce-service
spec:
  type: NodePort
  selector:
    app: health-plus   # <--- Aici trebuie să fie exact eticheta din deployment.yaml
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
