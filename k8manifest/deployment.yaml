apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  labels:
    app: health-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-plus
  template:
    metadata:
      labels:
        app: health-plus
    spec:
      containers:
      - name: health-plus
        image: adrianirimus/health-plus:latest # Sau pune direct numele tău de utilizator Docker Hubhealth-plus:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config-volume
        configMap:
          name: health-plus-nginx-config
