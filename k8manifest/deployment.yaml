apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: health-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-plus
  template:
    metadata:
      labels:
        app: health-plus
    spec:
      containers:
      - name: health-plus
        # Folosim imaginea oficială urcată pe Docker Hub de pipeline-ul tău
        image: adrianirimus/health-plus-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config-volume
        configMap:
          name: health-plus-nginx-config
