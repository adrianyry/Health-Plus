apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  labels:
    app: health-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-plus
  template:
    metadata:
      labels:
        app: health-plus
    spec:
      containers:
      - name: health-plus
        #image: adrianirimus/health-plus:latest # Sau pune direct numele tău de utilizator Docker Hubhealth-plus:latest
        image: health-plus-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # --- ADAUGĂ ACESTE LINII ---
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # ---------------------------
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config-volume
        configMap:
          name: health-plus-nginx-config
