apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-plus-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: health-plus.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecommerce-service
            port:
              number: 80
