apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-plus-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: voltronet.go.ro
    http:
      paths:
      # 1. Rutele pentru API (Backend) - merg direct spre backend pe portul 5000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000

      # 2. Rutele pentru Frontend (React) - merg spre frontend pe portul 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

  # Regula fallback pentru acces direct prin IP sau localhost fără host definit
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
