name: CI/CD - Health-Plus App (Full Stack)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Push All Images & Deploy to K8s
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autentificare unică în Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 1. Construiește și trimite imaginea pentru BACKEND
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            adrianirimus/health-plus-backend:latest
            adrianirimus/health-plus-backend:${{ github.sha }}

      # 2. Construiește și trimite imaginea pentru FRONTEND
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            adrianirimus/health-plus-frontend:latest
            adrianirimus/health-plus-frontend:${{ github.sha }}

      # Configurează accesul la Kubernetes folosind secretul KUBE_CONFIG_DATA
      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Aplică manifestele Kubernetes și forțează reînnoirea pod-urilor
      - name: Apply Kubernetes Manifests & Restart
        run: |
          kubectl apply -f k8manifest/
          
          # Forțează rularea noilor imagini pe ambele deployment-uri
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout restart deployment/frontend-deployment
