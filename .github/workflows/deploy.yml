name: CI/CD - Health-Plus App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to K8s
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autentificare în Docker Hub (asigură-te că adaugi secretele în setările repo-ului pe GitHub)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Construiește și trimite imaginea Docker folosind commit SHA și tag-ul latest
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/health-plus:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/health-plus:${{ github.sha }}

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      #- name: Set up Kubectl
      #  uses: azure/setup-kubectl@v3

      # Configurează accesul la clusterul tău Kubernetes (folosind un kubeconfig salvat în secret)
      #- name: Configure Kubernetes Context
      #  uses: azure/k8s-set-context@v4
      #  with:
      #    method: kubeconfig
      #     kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      # Aplică manifestele k8s din repo-ul de aplicație și forțează reînnoirea pod-ului
      - name: Apply Kubernetes Manifests & Restart
        run: |
          kubectl apply -f k8manifest/nginx-configmap.yaml
          kubectl apply -f k8manifest/deployment.yaml
          kubectl apply -f k8manifest/service.yaml
          
          # Forțează rularea noii imagini
          kubectl rollout restart deployment ecommerce-app
